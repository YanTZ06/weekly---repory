name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://yantz06.github.io' }}
      PUBLIC_GITHUB_REPO: ${{ vars.PUBLIC_GITHUB_REPO || 'YanTZ06/weekly---repory' }}
      PUBLIC_MANAGE_API_URL: ${{ vars.PUBLIC_MANAGE_API_URL }}
      PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO || 'YanTZ06/weekly---repory' }}
      PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID || 'R_kgDOTjPEig' }}
      PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY || 'Announcements' }}
      PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run check
      - run: pnpm run validate:content
      - run: pnpm run validate:licenses
      - run: pnpm run validate:dimensions
      - run: pnpm run build:astro
      - run: pnpm exec pagefind --site dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
