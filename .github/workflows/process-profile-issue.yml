name: Process profile issue

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: content-management-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  process:
    if: >-
      contains(github.event.issue.labels.*.name, 'profile:update') ||
      startsWith(github.event.issue.title, '[个人资料]')
    runs-on: ubuntu-latest
    env:
      OWNER_LOGIN: ${{ vars.OWNER_LOGIN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: process
        run: pnpm exec tsx scripts/process-profile-issue.ts
      - if: steps.process.outputs.skip != 'true'
        run: pnpm run check
      - if: steps.process.outputs.skip != 'true'
        run: pnpm run validate:dimensions
      - if: steps.process.outputs.skip != 'true'
        run: pnpm run validate:content
      - name: Commit validated change
        if: steps.process.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/profile.json public/assets/profile
          git diff --cached --quiet || git commit -m "profile: process issue #${{ github.event.issue.number }}"
          git push
      - name: Trigger Pages deployment
        if: steps.process.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Confirm success and close issue
        if: steps.process.outputs.skip != 'true'
        env:
          PROCESS_KIND: profile
        run: pnpm exec tsx scripts/finalize-issue.ts
