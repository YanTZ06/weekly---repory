name: 管理自定义表情
description: 新增、替换、启用或停用自定义表情
title: "[表情管理] "
labels: ["asset:emoji"]
body:
  - type: dropdown
    id: operation
    attributes:
      label: 操作
      options: [新增, 替换, 启用, 停用]
    validations:
      required: true
  - type: input
    id: id
    attributes:
      label: 表情 ID
      placeholder: soc
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 名称
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: 图片
      description: 新增或替换时上传 PNG、WebP 或 GIF。
