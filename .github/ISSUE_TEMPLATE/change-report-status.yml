name: 更改周报事项状态
description: 隐藏、放入回收站或恢复公开
title: "[状态管理] "
labels: ["report:status"]
body:
  - type: input
    id: item-id
    attributes:
      label: 事项 ID
      placeholder: 20260725-c04e51
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: 操作
      options:
        - 隐藏
        - 放入回收站
        - 恢复公开
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认提交
      options:
        - label: 我理解该操作不会物理删除文件，历史仍保存在 Git 中。
          required: true
