name: 管理项目灵兽
description: 绑定项目、灵兽和地图站位
title: "[项目灵兽管理] "
labels: ["asset:project"]
body:
  - type: input
    id: project-name
    attributes:
      label: 项目名称
    validations:
      required: true
  - type: input
    id: project-slug
    attributes:
      label: 项目 slug
      placeholder: weekly-system
    validations:
      required: true
  - type: input
    id: creature-id
    attributes:
      label: 灵兽 ID
      placeholder: water-01
    validations:
      required: true
  - type: dropdown
    id: map-position
    attributes:
      label: 地图站位
      options:
        - academy-door
        - stone-bridge
        - lotus-pond
        - village-gate
        - waterside-courtyard
    validations:
      required: true
  - type: dropdown
    id: visible
    attributes:
      label: 是否在地图显示
      options: ["是", "否"]
    validations:
      required: true
