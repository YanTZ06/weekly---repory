name: 管理记录球
description: 新增、替换、启用或停用原创记录球
title: "[记录球管理] "
labels: ["asset:calendar-icon"]
body:
  - type: dropdown
    id: operation
    attributes:
      label: 操作
      options: [新增, 替换, 启用, 停用]
    validations:
      required: true
  - type: input
    id: id
    attributes:
      label: 记录球 ID
      placeholder: cloud-pattern
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 名称
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: 图片
      description: 新增或替换时上传 PNG。
