name: 修改周报事项
description: 修改已有事项，空白字段保留原值
title: "[修改事项] "
labels: ["report:update"]
body:
  - type: input
    id: item-id
    attributes:
      label: 事项 ID
      placeholder: 20260725-c04e51
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 新日期
      placeholder: 留空则保持原值
  - type: dropdown
    id: category
    attributes:
      label: 新分类
      options:
        - _未填写_
        - 为科协做了什么
        - 为自己做了什么
        - 其他
  - type: textarea
    id: content
    attributes:
      label: 新内容
      description: 只支持纯文本；留空保持原值。
  - type: textarea
    id: projects
    attributes:
      label: 新项目
      description: 多个值用逗号或换行分隔；留空保持原值。
  - type: textarea
    id: tags
    attributes:
      label: 新标签
      description: 多个值用逗号或换行分隔；新名称请先通过管理页创建标签，留空保持原值。
  - type: input
    id: emoji
    attributes:
      label: 新主表情
  - type: input
    id: calendar-icon
    attributes:
      label: 新记录球
  - type: dropdown
    id: replace-images
    attributes:
      label: 是否替换图片
      options: ["否", "是"]
  - type: textarea
    id: images
    attributes:
      label: 新图片
      description: 选择替换时上传，最多 9 张。
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认提交
      options:
        - label: 我确认修改后的内容可以公开。
          required: true
